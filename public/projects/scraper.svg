<svg xmlns="http://www.w3.org/2000/svg" viewBox="20 -17 1560 975" font-family="Inter, 'Segoe UI', system-ui, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f3f9ff"/><stop offset="1" stop-color="#cfe4f8"/></linearGradient>
    <radialGradient id="glow" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#1f7fd1" stop-opacity=".45"/><stop offset="1" stop-color="#1f7fd1" stop-opacity="0"/></radialGradient>
    <linearGradient id="bar" x1="0" x2="1"><stop offset="0" stop-color="#1a6fb8"/><stop offset="1" stop-color="#1f7fd1"/></linearGradient>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 10 5 0 10z" fill="#1a6fb8"/></marker>
  </defs>
  <rect x="-100" y="-100" width="1800" height="1200" fill="url(#bg)"/>
  <circle cx="800" cy="500" r="520" fill="url(#glow)"/>
  <g stroke="#0f3c6e" stroke-opacity=".06"><path d="M0 125H1600M0 250H1600M0 375H1600M0 500H1600M0 625H1600M0 750H1600M0 875H1600M200 0V1000M400 0V1000M600 0V1000M800 0V1000M1000 0V1000M1200 0V1000M1400 0V1000"/></g>

  <!-- source pages -->
  <g transform="translate(290 470) scale(1.22) translate(-290 -470)"><g transform="translate(90 190)">
    <rect width="400" height="560" rx="22" fill="#ffffff" stroke="#0f3c6e" stroke-opacity=".16"/>
    <circle cx="30" cy="30" r="7" fill="#ff6b6b"/><circle cx="54" cy="30" r="7" fill="#ffc857"/><circle cx="78" cy="30" r="7" fill="#4cd27a"/>
    <rect x="110" y="16" width="260" height="28" rx="14" fill="#0f3c6e" fill-opacity=".07"/>
    <text x="130" y="36" font-size="15" fill="#0b2540b3" font-family="ui-monospace, Consolas, monospace">company-site.com/about</text>
    <rect x="30" y="80" width="200" height="22" rx="6" fill="#0b2540" fill-opacity=".85"/>
    <g fill="#0f3c6e" fill-opacity=".14"><rect x="30" y="126" width="340" height="12" rx="6"/><rect x="30" y="152" width="310" height="12" rx="6"/><rect x="30" y="178" width="330" height="12" rx="6"/><rect x="30" y="204" width="260" height="12" rx="6"/></g>
    <rect x="30" y="250" width="150" height="110" rx="12" fill="#1f7fd1" fill-opacity=".25" stroke="#1a6fb8" stroke-opacity=".5"/>
    <rect x="200" y="250" width="170" height="110" rx="12" fill="#0f3c6e" fill-opacity=".06"/>
    <g fill="#0f3c6e" fill-opacity=".14"><rect x="30" y="390" width="340" height="12" rx="6"/><rect x="30" y="416" width="290" height="12" rx="6"/><rect x="30" y="442" width="320" height="12" rx="6"/><rect x="30" y="468" width="200" height="12" rx="6"/></g>
    <text x="30" y="530" font-size="18" font-weight="600" fill="#1a6fb8" font-family="ui-monospace, Consolas, monospace">company pages</text>
  </g></g>

  <path d="M540 470H574" stroke="#1a6fb8" stroke-width="4" stroke-dasharray="4 10" stroke-linecap="round" marker-end="url(#arr)"/>

  <!-- agent terminal -->
  <g transform="translate(800 470) scale(1.22) translate(-800 -470)"><g transform="translate(620 230)">
    <rect width="360" height="480" rx="22" fill="#08111c" stroke="#1a6fb8" stroke-opacity=".5" stroke-width="2"/>
    <text x="28" y="52" font-size="17" fill="#8fd0ff" font-family="ui-monospace, Consolas, monospace">$ claude code</text>
    <g font-family="ui-monospace, Consolas, monospace" font-size="17" fill="#e6f2ffcc">
      <text x="28" y="100">fetch(url)</text>
      <text x="28" y="136">parse(html)</text>
      <text x="28" y="172">extract(fields)</text>
      <text x="28" y="208">validate(rows)</text>
      <text x="28" y="244">retry(on_fail)</text>
    </g>
    <g fill="#4cd27a"><circle cx="318" cy="94" r="7"/><circle cx="318" cy="130" r="7"/><circle cx="318" cy="166" r="7"/><circle cx="318" cy="202" r="7"/><circle cx="318" cy="238" r="7"/></g>
    <rect x="28" y="290" width="304" height="10" rx="5" fill="#ffffff" fill-opacity=".1"/><rect x="28" y="290" width="236" height="10" rx="5" fill="url(#bar)"/>
    <text x="28" y="340" font-size="15" fill="#e6f2ffb3" font-family="ui-monospace, Consolas, monospace">python scraper.py --batch</text>
    <text x="28" y="372" font-size="15" fill="#4cd27a" font-family="ui-monospace, Consolas, monospace">&#10003; done</text>
    <rect x="94" y="354" width="12" height="22" fill="#8fd0ff" opacity=".8"/>
  </g></g>

  <path d="M1026 470H1060" stroke="#1a6fb8" stroke-width="4" stroke-dasharray="4 10" stroke-linecap="round" marker-end="url(#arr)"/>

  <!-- structured output -->
  <g transform="translate(1310 470) scale(1.22) translate(-1310 -470)"><g transform="translate(1110 210)">
    <rect width="400" height="520" rx="22" fill="#ffffff" stroke="#0f3c6e" stroke-opacity=".16"/>
    <rect width="400" height="60" rx="22" fill="#1f7fd1" fill-opacity=".3"/><rect y="40" width="400" height="20" fill="#1f7fd1" fill-opacity=".3"/>
    <g font-size="16" font-weight="600" fill="#0b2540"><text x="24" y="38">Company</text><text x="170" y="38">Sector</text><text x="290" y="38">Funding</text></g>
    <g fill="#0f3c6e" fill-opacity=".12">
      <rect x="24" y="92" width="110" height="12" rx="6"/><rect x="170" y="92" width="80" height="12" rx="6"/><rect x="290" y="92" width="70" height="12" rx="6"/>
      <rect x="24" y="148" width="90" height="12" rx="6"/><rect x="170" y="148" width="100" height="12" rx="6"/><rect x="290" y="148" width="60" height="12" rx="6"/>
      <rect x="24" y="204" width="120" height="12" rx="6"/><rect x="170" y="204" width="70" height="12" rx="6"/><rect x="290" y="204" width="80" height="12" rx="6"/>
      <rect x="24" y="260" width="100" height="12" rx="6"/><rect x="170" y="260" width="90" height="12" rx="6"/><rect x="290" y="260" width="64" height="12" rx="6"/>
      <rect x="24" y="316" width="130" height="12" rx="6"/><rect x="170" y="316" width="76" height="12" rx="6"/><rect x="290" y="316" width="70" height="12" rx="6"/>
    </g>
    <g stroke="#0f3c6e" stroke-opacity=".1"><path d="M0 124H400M0 180H400M0 236H400M0 292H400M0 348H400"/></g>
    <rect x="24" y="394" width="352" height="96" rx="16" fill="#1a6fb8" fill-opacity=".1" stroke="#1a6fb8" stroke-opacity=".4"/>
    <text x="48" y="438" font-size="34" font-weight="700" fill="#0b2540">~65% faster</text>
    <text x="48" y="470" font-size="18" fill="#1a6fb8" font-family="ui-monospace, Consolas, monospace">1 day &#8594; 2-3 hours</text>
  </g></g>
</svg>
